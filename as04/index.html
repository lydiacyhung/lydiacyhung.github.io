<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>期末悲慘故事</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --accent-color: #38bdf8;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      padding: 2rem 1rem 4rem 1rem;
    }

    header {
      text-align: center;
      max-width: 800px;
      margin: 1rem auto 3rem auto;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    /* 故事圖片容器 */
    .story-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .story-card {
      position: relative;
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .story-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
    }

    .story-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      padding-top: 2rem;
      color: var(--text-sub);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>期末悲慘故事</h1>
    <p>AS04 </p>
  </header>

  <main class="story-container">
    <div class="story-card">
      <img src="img1.jpeg" alt="Scene 1">
    </div>

    <div class="story-card">
      <img src="img2.jpeg" alt="Scene 2">
    </div>

    <div class="story-card">
      <img src="img3.jpeg" alt="Scene 3">
    </div>

    <div class="story-card">
      <img src="img4.jpeg" alt="Scene 4">
    </div>

    <div class="story-card">
      <img src="img5.jpeg" alt="Scene 5">
    </div>

    <div class="story-card">
      <img src="img6.jpeg" alt="Scene 6">
    </div>

    <div class="story-card">
      <img src="img7.jpeg" alt="Scene 7">
    </div>

    <div class="story-card">
      <img src="img8.jpeg" alt="Scene 8">
    </div>
  </main>

  <footer>
    <p>AS04</p>
  </footer>

</body>
</html>
