<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滾動網站</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    html {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body id="top" class="bg-gray-100 text-gray-800 antialiased">

  <!-- 1. 最上方 Banner (背景 #3081BB, 文字黑色大字) -->
  <header class="w-full bg-[#3081BB] text-black py-10 text-center shadow-inner">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-wide">這裡是Banner</h1>
  </header>

  <!-- 2. 吸頂導覽列 (Sticky Navigation) -->
  <nav id="navbar" class="sticky top-0 z-50 w-full bg-white/95 backdrop-blur-md shadow-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center space-x-8 h-16">
        <!-- 首頁：點擊平滑滑回最頂端 (#top) -->
        <a href="#top" class="nav-link text-black font-bold text-base md:text-lg hover:text-blue-600 transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-black">
          首頁
        </a>
        <!-- 區段1：灰色文字 (#6c757d) -->
        <a href="#section1" class="nav-link text-[#6c757d] font-medium text-base md:text-lg hover:text-gray-900 transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-gray-600">
          區段1
        </a>
        <!-- 區段2：灰色文字 (#6c757d) -->
        <a href="#section2" class="nav-link text-[#6c757d] font-medium text-base md:text-lg hover:text-gray-900 transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-gray-600">
          區段2
        </a>
        <!-- 區段3：灰色文字 (#6c757d) -->
        <a href="#section3" class="nav-link text-[#6c757d] font-medium text-base md:text-lg hover:text-gray-900 transition-colors duration-200 py-2 border-b-2 border-transparent hover:border-gray-600">
          區段3
        </a>
      </div>
    </div>
  </nav>

  <!-- 主內容區域 -->
  <main class="w-full">

    <!-- ==================== 區段 1 ==================== -->
    <section id="section1" class="w-full">
      <!-- 滿版 Banner (高度 100vh, 文字大小 40px, 更淺的薰衣草紫背景 #F3E8FF) -->
      <div class="w-full h-screen bg-[#F3E8FF] flex items-center justify-center shadow-md">
        <h2 class="text-[40px] font-extrabold text-purple-900 tracking-wider drop-shadow-sm">
          區段1 Banner
        </h2>
      </div>

      <!-- 置中內容區塊 -->
      <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="w-full md:w-8/12 mx-auto bg-[#f8f9fa] rounded-2xl p-8 md:p-12 shadow-lg border border-gray-200/80">
          <h3 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4 text-left">
            區段1內容
          </h3>
          <p class="text-base md:text-lg text-gray-600 leading-relaxed text-left">
            這是區段1的內容。
          </p>
        </div>
      </div>

      <!-- 螢幕大小的留白 Spacer (100vh)，無文字 -->
      <div class="w-full h-screen bg-gray-50/50 border-y border-dashed border-gray-300"></div>
    </section>

    <!-- ==================== 區段 2 ==================== -->
    <section id="section2" class="w-full">
      <!-- 滿版 Banner (高度 100vh, 文字大小 40px, 更淺的薰衣草紫背景 #F3E8FF) -->
      <div class="w-full h-screen bg-[#F3E8FF] flex items-center justify-center shadow-md">
        <h2 class="text-[40px] font-extrabold text-purple-900 tracking-wider drop-shadow-sm">
          區段2 Banner
        </h2>
      </div>

      <!-- 置中內容區塊 -->
      <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="w-full md:w-8/12 mx-auto bg-[#f8f9fa] rounded-2xl p-8 md:p-12 shadow-lg border border-gray-200/80">
          <h3 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4 text-left">
            區段2內容
          </h3>
          <p class="text-base md:text-lg text-gray-600 leading-relaxed text-left">
            這是區段2的內容。
          </p>
        </div>
      </div>

      <!-- 螢幕大小的留白 Spacer (100vh)，無文字 -->
      <div class="w-full h-screen bg-gray-50/50 border-y border-dashed border-gray-300"></div>
    </section>

    <!-- ==================== 區段 3 ==================== -->
    <section id="section3" class="w-full">
      <!-- 滿版 Banner (高度 100vh, 文字大小 40px, 更淺的薰衣草紫背景 #F3E8FF) -->
      <div class="w-full h-screen bg-[#F3E8FF] flex items-center justify-center shadow-md">
        <h2 class="text-[40px] font-extrabold text-purple-900 tracking-wider drop-shadow-sm">
          區段3 Banner
        </h2>
      </div>

      <!-- 置中內容區塊 -->
      <div class="max-w-7xl mx-auto px-4 py-12">
        <div class="w-full md:w-8/12 mx-auto bg-[#f8f9fa] rounded-2xl p-8 md:p-12 shadow-lg border border-gray-200/80">
          <h3 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4 text-left">
            區段3內容
          </h3>
          <p class="text-base md:text-lg text-gray-600 leading-relaxed text-left">
            這是區段3的內容。
          </p>
        </div>
      </div>

      <!-- 螢幕大小的留白 Spacer (100vh)，無文字 -->
      <div class="w-full h-screen bg-gray-50/50 border-y border-dashed border-gray-300"></div>
    </section>

  </main>

  <!-- 客製化放慢滑動 JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navLinks = document.querySelectorAll('.nav-link');
      const navbar = document.getElementById('navbar');

      /**
       * 自訂平滑滾動函式
       * @param {number} targetPosition 滾動目標的 Y 軸位置
       * @param {number} duration 滾動時間 (毫秒)
       */
      function slowScrollTo(targetPosition, duration = 1200) {
        const startPosition = window.pageYOffset || document.documentElement.scrollTop;
        const distance = targetPosition - startPosition;
        let startTime = null;

        // Ease-out Cubic 緩動效果，讓動畫開頭加速、結尾漸慢流暢
        function easeOutCubic(t) {
          return (--t) * t * t + 1;
        }

        function animation(currentTime) {
          if (startTime === null) startTime = currentTime;
          const timeElapsed = currentTime - startTime;
          const progress = Math.min(timeElapsed / duration, 1);
          const easeProgress = easeOutCubic(progress);

          window.scrollTo(0, startPosition + distance * easeProgress);

          if (timeElapsed < duration) {
            requestAnimationFrame(animation);
          }
        }

        requestAnimationFrame(animation);
      }

      // 為導覽列連結綁定點擊事件
      navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const targetId = link.getAttribute('href');

          let targetPosition = 0;

          if (targetId !== '#top') {
            const targetElement = document.querySelector(targetId);
            if (targetElement) {
              const navHeight = navbar ? navbar.offsetHeight : 0;
              // 計算目標位置，補償固定導覽列高度
              targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - navHeight;
            }
          }

          // 執行放慢的滑動動畫 (持續時間設定為 1200ms)
          slowScrollTo(targetPosition, 1200);
        });
      });
    });
  </script>
</body>
</html>
